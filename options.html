<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Out of Sight — Settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
    h1 { font-size: 20px; }
    textarea { width: 100%; height: 260px; font: 13px ui-monospace, Menlo, monospace; padding: 8px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 6px 16px; font-size: 14px; cursor: pointer; }
    .hint { color: #59636e; }
    #status { margin-left: 8px; color: #1a7f37; }
  </style>
</head>
<body>
  <h1>Out of Sight</h1>
  <p class="hint">GitHub usernames or display names to hide, one per line. Matching is case-insensitive; a leading <code>@</code> is ignored. Their comments and reviews disappear on github.com.</p>
  <textarea id="users" spellcheck="false" placeholder="octocat&#10;some-bot[bot]&#10;Jane Doe"></textarea>
  <div>
    <button id="save">Save</button><span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
